name: khodan
description: "A modern livestock management companion for small and mid-sized farmers."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.8.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # <--- AJOUTÉ
    sdk: flutter         # <--- AJOUTÉ
  supabase_flutter: ^2.6.0
  go_router: ^14.2.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Pour la galerie d'images ---
  image_picker: ^1.1.2
  image_cropper: ^7.0.5

  # --- Pour les graphiques et rapports ---
  fl_chart: ^0.68.0

  # --- Pour le mode hors-ligne (base de données locale) ---
  drift: ^2.17.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2

  # --- Pour le scan de QR Code ---
  mobile_scanner: ^5.1.1

  # --- Pour l'export PDF et le partage ---
  pdf: ^3.10.8
  printing: ^5.13.1
  share_plus: ^9.0.0
  
  # --- Suggestion pour le tableau de bord personnalisable ---
  reorderable_grid_view: ^2.2.8


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Dépendances de développement pour Drift (base de données locale)
  drift_dev: ^2.17.0
  build_runner: ^2.4.10


flutter:
  uses-material-design: true