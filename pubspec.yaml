name: khodan
description: "A modern livestock management companion for small and mid-sized farmers."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.6.0
  go_router: ^14.2.1
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Nouvelles dépendances ajoutées ---

  # Pour la galerie d'images
  image_picker: ^1.1.2
  image_cropper: ^7.0.5

  # Pour les graphiques et rapports
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2

  # Pour le mode hors-ligne (base de données locale)
  drift: ^2.17.0
  connectivity_plus: ^6.0.3
  sqlite3_flutter_libs: ^0.5.21

  # Pour le scan de QR Code
  mobile_scanner: ^5.1.1

  # Pour l'export PDF et le partage
  pdf: ^3.10.8
  printing: ^5.11.1 # <- AJOUTÉ ICI
  share_plus: ^9.0.0
  flutter_markdown: ^0.6.20
  intl: ^0.20.2
  csv: ^6.0.0
  file_picker: ^8.0.0
  shared_preferences: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.1
  uuid: ^4.4.0
  image: ^4.2.0
  qr_flutter: ^4.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  mocktail: ^0.3.0
  connectivity_plus_platform_interface: ^2.0.1
  sqflite_common_ffi: ^2.3.1
  # Dépendances de développement pour Drift (base de données locale)
  drift_dev: ^2.17.0
  build_runner: ^2.4.10


flutter:
  generate: true
  uses-material-design: true
